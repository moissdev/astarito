<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Astarito</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 3rem auto; padding: 0 1rem; }
    code { background: #eee; padding: 0.1rem 0.3rem; border-radius: 4px; }
  </style>
</head>
<body>
  <!-- Página de prueba del despliegue: se reemplaza por el build del frontend en el checkpoint 11. -->
  <h1>Astarito</h1>
  <p>Página estática servida desde <code>public/</code>.</p>
  <p>Health check de la API: <strong id="health">consultando…</strong></p>
  <script>
    const out = document.getElementById("health");
    fetch("/api/health")
      .then((r) => (r.ok ? r.json() : Promise.reject(r.status)))
      .then((data) => { out.textContent = data.status; })
      .catch((err) => { out.textContent = "error (" + err + ")"; });
  </script>
</body>
</html>
