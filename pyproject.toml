[project]
name = "astarito"
version = "0.1.0"
description = "Robot minero que traza con A* la ruta de menor consumo hasta una veta de oro."
readme = "README.md"
requires-python = ">=3.12"
# Solo dependencias de ejecución: es lo único que Vercel instala.
dependencies = ["fastapi>=0.115"]

# Dependencias de desarrollo (PEP 735): pip install --group dev
[dependency-groups]
dev = ["pytest>=8", "httpx2>=2.0", "uvicorn>=0.30"]

[tool.vercel]
entrypoint = "backend.api:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
